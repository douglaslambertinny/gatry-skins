services:
  db:
    image: postgres:15.0
    environment:
      POSTGRES_USER: gatry
      POSTGRES_PASSWORD: gatry
      POSTGRES_DB: gatry
    ports:
      - "5432:5432"
    networks:
      - gatry-skins
volumes:
  db: null
networks:
  gatry-skins:
    driver: bridge
    

    

